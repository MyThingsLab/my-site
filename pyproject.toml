[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "my-site"
version = "0.0.1"
description = "Drafts Jekyll content (pages, notes, nav) from a content-change issue and opens a PR."
authors = [{ name = "Lorenzo Liuzzo", email = "lorenzoliuzzo@outlook.com" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["my-things-core", "my-guard"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "pre-commit>=3"]

[project.scripts]
mysite = "mysite.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mysite"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
# Prepended to sys.path, so a git-worktree checkout tests its OWN src rather
# than the editable install in the shared root .venv -- which points at the
# main checkout. A worker session runs in a worktree, and without this its
# suite silently exercises main's code instead of the change under review.
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: integration/slow tests, excluded from the fast local loop"]
